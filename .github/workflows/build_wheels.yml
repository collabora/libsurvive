# This is a basic workflow to help you get started with Actions

name: Build Wheels

on:
  push:
  create:
    tags: [ master ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build_wheels:
    name: Build and test wheel (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v7
        name: Setup Python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install python dependencies
        run: python -m pip install build twine

      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        if: runner.os == 'Linux'
        name: Install dependencies
        with:
          packages: build-essential cmake git libeigen3-dev liblapacke-dev libopenblas-dev libpcap-dev libusb-1.0-0-dev zlib1g-dev

      - name: Install Eigen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install eigen3:x64-windows
          "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: python -m build --wheel

      - name: Test wheel (py${{ matrix.python-version }})
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv test-env
          . test-env/*/activate
          # --no-deps: the gooey dependency (the GUI launcher only) pulls in wxpython,
          # which has no Linux wheels and needs GTK to compile; import needs nothing else.
          python -m pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          python -c "import pysurvive; print(pysurvive.__file__)"

      - uses: actions/upload-artifact@v7
        name: Upload
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

  publish:
    name: Publish wheels to PyPI
    needs: build_wheels
    if: github.repository == 'collabora/libsurvive' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Upload with twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_TOKEN }}
        run: |
          python -m pip install twine
          python -m twine upload dist/*.whl --skip-existing
