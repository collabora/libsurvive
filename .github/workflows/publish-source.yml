name: Publish source

on:
  push:
  release:
    types:
      - created

jobs:
  gather-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Set bundle name
      id: bundle
      working-directory: ${{runner.workspace}}/libsurvive      
      shell: bash
      run: echo "BUNDLE_FILE_NAME=libsurvive-$(git describe --tags)-source.zip" >> "$GITHUB_OUTPUT"

    - name: Generate version
      working-directory: ${{runner.workspace}}/libsurvive
      run: git describe --dirty --tags > VERSION

    - name: Remove git directories
      working-directory: ${{runner.workspace}}/libsurvive
      run: rm -rf .git

    - name: Bundle
      working-directory: ${{runner.workspace}}/libsurvive
      run: 7z a ${{runner.workspace}}/${{ steps.bundle.outputs.BUNDLE_FILE_NAME }} ${{runner.workspace}}/libsurvive

    - uses: actions/upload-artifact@v7
      name: Upload
      with:
        name: ${{ steps.bundle.outputs.BUNDLE_FILE_NAME }}
        path: ${{runner.workspace}}

    - name: Upload Release Asset
      if: github.event_name == 'release'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ github.event.release.tag_name }}" "${{runner.workspace}}/${{steps.bundle.outputs.BUNDLE_FILE_NAME}}" --clobber
